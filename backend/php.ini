; -------------------------------------------------------------
; Accaive Design Studio - PHP Security Hardening Configuration
; Mitigates: CVE-2026-109618 / CVE-2026-109619 (php2shell) & Information Leakage
; -------------------------------------------------------------

; Disable upload progress parsing to close memory parsing attack vector
session.upload_progress.enabled = Off

; Prevent PHP version disclosure in HTTP response headers
expose_php = Off

; Production error handling (never display detailed errors to visitors)
display_errors = Off
display_startup_errors = Off
log_errors = On

; Sane limits
max_execution_time = 60
memory_limit = 256M
post_max_size = 32M
upload_max_filesize = 25M
